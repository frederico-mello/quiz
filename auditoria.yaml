# Repository hygiene auditor configuration
# Rules, severities, and exceptions for automated checks

config_version: 1

rules:
  tracked_secrets:
    enabled: true
    severidade: error
  broken_internal_links:
    enabled: true
    severidade: error
  missing_references:
    enabled: true
    severidade: error
  untracked_artifacts:
    enabled: true
    severidade: error
  empty_gitkeep_directories:
    enabled: true
    severidade: warning
  unreferenced_files:
    enabled: true
    severidade: warning
  outdated_documentation:
    enabled: true
    severidade: warning
  unintegrated_configurations:
    enabled: true
    severidade: warning
  stale_openspec_changes:
    enabled: true
    severidade: warning
  insecure_workflows:
    enabled: true
    severidade: warning

exceptions:
  tracked_secrets:
    - .secrets.baseline
    - .env.example
  broken_internal_links: []
  missing_references:
    - auditoria-report.txt
  untracked_artifacts:
    - .git
  empty_gitkeep_directories: []
  unreferenced_files:
    - .gitignore
    - Makefile
  outdated_documentation: []
  unintegrated_configurations: []
  stale_openspec_changes: []
  insecure_workflows: []
