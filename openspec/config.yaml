schema: spec-driven

# NOTA (2026-09-28): a extensao OpenSpec Plus foi aposentada.
# As regras MANDATORY que exigiam seus skills foram removidas deste config.
# A regra "archive" abaixo NAO era da extensao: ela exige sincronizar os
# deltas nas specs principais antes de arquivar, via openspec-sync-specs.

# Project context (optional)
# This is shown to AI when creating artifacts.
# Add your tech stack, conventions, style guides, domain knowledge, etc.
# Example:
#   context: |
#     Tech stack: TypeScript, React, Node.js
#     We use conventional commits
#     Domain: e-commerce platform

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always include a "Non-goals" section
#     tasks:
#       - Break tasks into chunks of max 2 hours

rules:
  archive:
    - "MANDATORY: Sync delta specs to main specs during archive. Run openspec-sync-specs BEFORE archiving the change. This ensures main specs never drift from completed changes."
